[project]
name = "knowgrid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshu Saha", email = "anshusahaa62@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "django==6.1.2",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "dotenv>=0.9.9",
    "drf-spectacular>=0.30.0",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pygments>=2.21.0",
    "redis==5.3.1",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
knowgrid = "knowgrid:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
